<!doctype html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<title>Tarjeta · 20 configuraciones gratis</title>
<style>
@font-face{font-family:"Creepster";src:url("assets/Creepster-latin.woff2") format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:500 800;src:url("assets/BricolageGrotesque-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Bricolage Grotesque";font-weight:500 800;src:url("assets/BricolageGrotesque-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA}
@font-face{font-family:"Geist";font-weight:400 700;src:url("assets/Geist-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Geist";font-weight:400 700;src:url("assets/Geist-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA}
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:radial-gradient(120% 80% at 50% 15%,#3A1D5E 0%,#22113A 50%,#120820 100%);--ink:#FFF3E0;--muted:#E6D7F5;--accent:#FFC107;--hot:#FF7A1A;--chipInk:#1F1405;--line:rgba(235,225,255,.5)}
body.cl{--bg:radial-gradient(120% 80% at 50% 10%,#FFFDF6 0%,#FFF6DD 60%,#FFE9B0 100%);--ink:#1F1F1F;--muted:#4A4238;--accent:#FFC107;--hot:#E8590C;--line:rgba(0,0,0,.08)}
html,body{width:1080px;height:var(--h);overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Geist",sans-serif;position:relative}
.abs{position:absolute}
.brand{left:60px;top:56px;display:flex;align-items:center;gap:18px;font:600 34px/1 "Geist",sans-serif}
.brand img{width:68px;height:68px;border-radius:18px}
.brand b{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.03em;font-size:40px}
.brand i{font-style:normal;color:var(--accent)}
h1{left:60px;right:60px;text-align:center;line-height:.95}
body.hw h1{font-family:"Creepster",cursive;font-weight:400;color:var(--hot);text-shadow:0 7px 0 #4A1A00}
body.cl h1{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.045em;color:var(--ink)}
body.cl h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--accent) 58%)}
.sub{left:60px;right:60px;text-align:center;font:600 40px/1.25 "Geist",sans-serif;color:var(--muted)}
.badge{left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--accent);color:var(--chipInk);border-radius:36px;text-align:center;box-shadow:0 24px 50px -18px rgba(0,0,0,.55)}
.badge b{display:block;font:800 150px/.9 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em}
.badge span{display:block;font:800 52px/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.badge small{display:inline-block;margin-top:14px;padding:10px 22px;border-radius:999px;background:var(--chipInk);color:var(--accent);font:700 28px/1 "Geist",sans-serif;letter-spacing:.12em;text-transform:uppercase}
.pascal{filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.qr{background:#fff;border-radius:44px;text-align:center;box-shadow:0 0 0 10px rgba(255,193,7,.35),0 30px 60px -20px rgba(0,0,0,.6)}
.qrc{position:relative}
.qrc>img:first-child{display:block;width:100%;height:100%}
.qrlogo{position:absolute;left:50%;top:50%;width:27%;height:27%;transform:translate(-50%,-50%);border-radius:28%;box-shadow:0 0 0 10px #fff}
.qr p{font:800 34px/1 "Bricolage Grotesque",sans-serif;color:#1F1F1F}
.steps{display:flex;flex-direction:column;gap:18px}
.steps div{display:flex;align-items:center;gap:18px;font:600 36px/1.15 "Geist",sans-serif}
.steps i{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--chipInk);font:800 32px/1 "Bricolage Grotesque";font-style:normal}
.fine{left:60px;right:60px;text-align:center;font:500 26px/1.35 "Geist",sans-serif;color:var(--muted);opacity:.9}
.url{left:60px;right:60px;text-align:center;font:700 38px/1 "Geist",sans-serif;color:var(--accent)}
body.cl .url{color:#B7791F}
.web{width:330px;height:330px;opacity:.7}
.web path{fill:none;stroke:var(--line);stroke-width:2}
body.cl .web,body.cl .spider{display:none}
.spider line{stroke:rgba(235,225,255,.6);stroke-width:2}
</style>
</head>
<body>
<script>
// Variant from the hash: #story-hw, #feed-hw, #story-cl, #feed-cl
const [fmt, theme] = (location.hash.slice(1) || 'story-hw').split('-');
document.body.className = theme;
document.documentElement.style.setProperty('--h', fmt === 'story' ? '1920px' : '1350px');
document.title = 'tarjeta-' + fmt + '-' + theme;

function web(style){
  const angs=[0,15,30,45,60,75,90], rings=[55,110,170,235,300]; let d='';
  angs.forEach(a=>{const r=a*Math.PI/180; d+=`M0 0 L${330*Math.cos(r)} ${330*Math.sin(r)} `;});
  rings.forEach(R=>{const p=angs.map(a=>[R*Math.cos(a*Math.PI/180),R*Math.sin(a*Math.PI/180)]); d+=`M${p[0][0]} ${p[0][1]} `;
    for(let i=1;i<p.length;i++){const mx=(p[i-1][0]+p[i][0])/2*.86,my=(p[i-1][1]+p[i][1])/2*.86; d+=`Q${mx} ${my} ${p[i][0]} ${p[i][1]} `;}});
  return `<svg class="abs web" style="${style}" viewBox="0 0 330 330"><path d="${d}"/></svg>`;
}
function spider(x,drop){
  let legs='';[-1,1].forEach(s=>[[-10,40,-28],[-3,44,-6],[4,42,16],[10,34,34]].forEach(([dy,ex,ey])=>{legs+=`<path d="M${45+s*12} ${drop+40+dy} Q${45+s*(ex-6)} ${drop+30+dy} ${45+s*ex} ${drop+40+ey}" stroke="#0B0612" stroke-width="5" fill="none" stroke-linecap="round"/>`;}));
  return `<svg class="abs spider" style="left:${x}px;top:0;width:80px" viewBox="0 0 90 ${drop+70}"><line x1="45" y1="0" x2="45" y2="${drop+20}"/>${legs}<ellipse cx="45" cy="${drop+44}" rx="20" ry="24" fill="#0B0612"/><circle cx="45" cy="${drop+22}" r="13" fill="#0B0612"/><circle cx="40" cy="${drop+21}" r="4" fill="#FF7A1A"/><circle cx="50" cy="${drop+21}" r="4" fill="#FF7A1A"/></svg>`;
}
const hw = theme === 'hw';
const title = hw ? 'Último día<br>sin sustos' : 'El último día,<br><em>sin afán</em>';
const steps = `<div class="abs steps" style="__POS__">
  <div><i>1</i>Le cuentas tu día a Pascal por WhatsApp</div>
  <div><i>2</i>Él arma tu informe y tu cuenta</div>
  <div><i>3</i>Tú revisas, apruebas y firmas</div></div>`;
const qr = (x,y,w) => `<div class="abs qr" style="left:${x}px;top:${y}px;width:${w}px;padding:${w*.075}px ${w*.075}px ${w*.05}px">
  <div class="qrc" style="width:${w*.85}px;height:${w*.85}px"><img src="assets/qr.svg" alt=""><img class="qrlogo" src="assets/logo.webp" alt=""></div>
  <p style="margin-top:${w*.04}px;font-size:${Math.round(w*.06)}px">Escanéame y empieza</p></div>`;
const fine = 'Configuración del contrato gratis para los primeros 20 contratistas que se registren. El informe mensual se paga aparte. Pascal nunca inventa actividades: tú decides qué se reporta.';
let html = `<div class="abs brand"><img src="assets/logo.webp" alt=""><span><b>CuentaFácil</b> · de Pascal<i>IA</i></span></div>`;
if (hw) html += web('right:0;top:0;transform:scaleX(-1)') + spider(880, 120);
if (fmt === 'story') {
  html += `<h1 class="abs" style="top:190px;font-size:${hw?150:128}px">${title}</h1>
  <p class="abs sub" style="top:${hw?500:480}px">Tu cuenta de cobro, por WhatsApp con Pascal</p>
  <div class="abs badge" style="top:610px;padding:34px 70px 30px"><b>20</b><span>configuraciones<br>gratis</span><small>Solo 20 cupos</small></div>
  <img class="abs pascal" src="assets/pascal.webp" style="left:-30px;top:1060px;width:470px" alt="">
  ${qr(440,1040,560)}
  ${steps.replace('__POS__','left:440px;right:50px;top:1720px;display:none')}
  <p class="abs url" style="left:440px;right:80px;top:1690px">pascalia.lat/cuentafacil</p>
  <p class="abs fine" style="left:450px;right:70px;top:1748px;font-size:24px">${fine}</p>`;
} else {
  html += `<h1 class="abs" style="top:160px;font-size:${hw?118:104}px">${title}</h1>
  <div class="abs badge" style="top:430px;left:290px;padding:24px 44px 22px"><b style="font-size:120px">20</b><span style="font-size:42px">configuraciones<br>gratis</span><small style="font-size:24px">Solo 20 cupos</small></div>
  <img class="abs pascal" src="assets/pascal.webp" style="left:-10px;top:790px;width:280px" alt="">
  ${qr(650,400,380)}
  ${steps.replace('__POS__','left:290px;right:40px;top:860px')}
  <p class="abs url" style="left:290px;right:40px;top:1110px;text-align:left">pascalia.lat/cuentafacil</p>
  <p class="abs fine" style="left:290px;right:40px;top:1170px;font-size:23px;text-align:left">${fine}</p>`;
}
document.body.insertAdjacentHTML('beforeend', html);
</script>
</body>
</html>
