.ic{width:100%;height:100%;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pgs{display:flex;gap:14px;margin-top:24px}.pgs i{flex:1;height:130px;border-radius:12px;background:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.35),inset 0 0 0 2px #E6E6E6}.pgs i.on{box-shadow:inset 0 0 0 4px #FFC107}

.pill b{color:#FF6B6B}
