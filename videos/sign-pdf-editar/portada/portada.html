.ln{height:13px;margin:18px 0;border-radius:7px;background:#E3E3E3}
.fe{font:600 34px/1.4 Inter;color:#1F1F1F;margin:18px 0}
.old{color:#B42318;text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#E5484D}
.new{background:rgba(43,255,136,.35);border-radius:8px;padding:0 6px;font-weight:600}

.pen{position:absolute;left:140px;top:880px;width:130px;height:130px;border-radius:36px;background:#FFC107;padding:30px;transform:rotate(-12deg);box-shadow:0 20px 40px -14px rgba(0,0,0,.6)}
.pen svg{width:100%;height:100%;fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.apps{position:absolute;left:0;right:0;top:1450px;text-align:center}
.apps span{display:inline-flex;align-items:center;gap:16px;padding:14px 28px 14px 14px;border-radius:999px;background:#fff;color:#111;font:800 34px/1 Montserrat}
.apps img{width:64px;height:64px;border-radius:16px}
.apps b{color:#FFC107;font-size:44px;line-height:1}
