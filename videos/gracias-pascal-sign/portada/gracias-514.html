<!doctype html><html lang="es-CO"><head><meta charset="utf-8"><style>
@font-face{font-family:"Montserrat";font-weight:800;src:url("../assets/fonts/montserrat-latin-800-normal.woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url("../assets/fonts/inter-latin-600-normal.woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0D;font-family:Inter,sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 58%,rgba(255,193,7,.32),transparent 72%),radial-gradient(90% 36% at 50% 0%,rgba(255,193,7,.12),transparent 70%)}
.rays{position:absolute;left:-460px;top:420px;width:2000px;height:2000px;border-radius:50%;background:repeating-conic-gradient(rgba(255,193,7,.07) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 75%)}
.eyebrow{position:absolute;left:0;right:0;top:250px;text-align:center;font:800 40px/1 Montserrat;letter-spacing:.28em;color:#FFC107}
h1{position:absolute;left:30px;right:30px;top:305px;text-align:center;font:800 118px/1.02 Montserrat;letter-spacing:-.035em}
h1 em{font-style:normal;color:#FFC107;text-shadow:0 0 34px rgba(255,193,7,.55)}
.logo{position:absolute;left:370px;top:600px;width:340px;height:340px;border-radius:72px;box-shadow:0 0 0 6px #FFC107,0 0 110px rgba(255,193,7,.6),0 50px 90px -30px rgba(0,0,0,.9);overflow:hidden}
.logo img{width:100%;height:100%;display:block}
.card{position:absolute;top:1000px;width:450px;height:340px;border-radius:44px;background:#15151B;box-shadow:inset 0 0 0 3px rgba(255,193,7,.45),0 30px 60px -24px rgba(0,0,0,.8);text-align:center;padding-top:40px}
.card .n{font:800 190px/1 Montserrat;letter-spacing:-.04em;color:#FFC107;text-shadow:0 0 40px rgba(255,193,7,.45)}
.card .l{margin-top:14px;font:800 54px/1 Montserrat;color:#fff}
.msg{position:absolute;left:90px;right:90px;top:1385px;text-align:center;font:600 46px/1.4 Inter;color:#D9D9DE}
.panel{position:absolute;left:70px;right:70px;top:1545px;height:170px;border-radius:40px;background:#15151B;box-shadow:inset 0 0 0 3px rgba(255,193,7,.35);display:flex;align-items:center;padding:0 40px}
.panel .txt{flex:1}
.panel .t{font:800 44px/1.15 Montserrat;color:#fff}
.panel .u{font:600 32px/1.3 Inter;color:#FFC107;margin-top:10px}
.qr{width:140px;height:140px;border-radius:22px;background:#fff;padding:12px;margin-left:24px}
.qr img{width:100%;height:100%;display:block}
.foot{position:absolute;left:0;right:0;top:1755px;text-align:center;font:600 30px/1 Inter;color:#8A8A94;letter-spacing:.04em}
</style></head><body>
<div class="glow"></div><div class="rays"></div>
<p class="eyebrow">¡LLEGAMOS!</p>
<h1>Gracias por<br><em>tu confianza</em></h1>
<div class="logo"><img src="../assets/brand/pascal-sign-logo.webp" alt="Pascal Sign"></div>
<div class="card" style="left:70px"><div class="n">514</div><div class="l">firmas</div></div><div class="card" style="left:560px"><div class="n">10</div><div class="l">usuarios</div></div>
<p class="msg">Cada firma es un documento que nos confiaste. ¡Vamos por más! 🚀</p>
<div class="panel"><div class="txt"><div class="t">Firma desde tu celular</div><div class="u">pascalia.lat/PascalSign</div></div><div class="qr"><img src="../assets/brand/qr-pascalsign.svg" alt="QR"></div></div>
<p class="foot">Pascal Sign · by PascalIA</p>
</body></html>
