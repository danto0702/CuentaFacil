<!doctype html><html lang="es-CO"><head><meta charset="utf-8"><style>
@font-face{font-family:"Montserrat";font-weight:800;src:url("../assets/fonts/montserrat-latin-800-normal.woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0D;color:#fff;position:relative;font-family:Montserrat}
.glow{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 42%,rgba(255,193,7,.26),transparent 72%)}
.rays{position:absolute;left:-460px;top:-160px;width:2000px;height:2000px;border-radius:50%;background:repeating-conic-gradient(rgba(255,193,7,.06) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 75%)}
.top{position:absolute;left:0;right:0;top:300px;text-align:center;font:800 70px/1.08 Montserrat;color:#E6E6E6}
.watch{position:absolute;left:250px;top:560px;width:580px;height:580px;border-radius:50%;background:#16161B;box-shadow:inset 0 0 0 16px #2A2A33,0 0 0 8px #FFC107,0 0 110px rgba(255,193,7,.5)}
.watch:before{content:"";position:absolute;left:255px;top:-64px;width:70px;height:64px;border-radius:14px 14px 0 0;background:#2A2A33}
.watch b{position:absolute;left:0;right:0;top:190px;text-align:center;font:800 190px/1 Montserrat;color:#FFC107;text-shadow:0 0 34px rgba(255,193,7,.6)}
.watch small{position:absolute;left:0;right:0;top:400px;text-align:center;font:800 46px/1 Montserrat;color:#CFCFCF}
.hand{position:absolute;left:286px;top:70px;width:9px;height:220px;border-radius:5px;background:#E5484D;transform-origin:4.5px 220px;transform:rotate(18deg)}
.sub{position:absolute;left:0;right:0;top:1210px;text-align:center;font:800 66px/1.1 Montserrat}
.sub em{font-style:normal;color:#FFC107}
.n{position:absolute;left:0;right:0;top:1390px;text-align:center}
.n span{display:inline-flex;align-items:center;gap:14px;padding:20px 36px;border-radius:999px;background:#fff;color:#111;font:800 46px/1 Montserrat}
.n b{background:#FFC107;padding:6px 16px;border-radius:12px}
</style></head><body><div class="glow"></div><div class="rays"></div>
<p class="top">Tu página web tiene</p>
<div class="watch"><div class="hand"></div><b>0,05</b><small>segundos</small></div>
<p class="sub">para <em>convencer</em> a alguien</p>
<p class="n"><span><b>5 datos</b> que no sabías</span></p>
</body></html>
