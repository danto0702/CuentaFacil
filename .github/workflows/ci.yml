name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  checks:
    # Golden PDFs depend on the LibreOffice build: keep the runner image pinned.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages (LibreOffice, fonts, poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea poppler-utils
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit, conversation, golden and end-to-end tests
        run: pnpm -r --workspace-concurrency=1 test
      - name: Database (migrations, seed, RLS)
        run: bash supabase/tests/run.sh
      - name: Panel build
        run: pnpm --filter @cuentasbot/panel build
