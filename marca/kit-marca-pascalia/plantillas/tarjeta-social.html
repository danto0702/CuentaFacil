<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Tarjeta social · PascalIA</title>
<!-- Imagen para compartir (Open Graph) de 1200 × 630. Cambia el titular y exporta con un navegador a ese tamaño. -->
<link rel="stylesheet" href="../css/fuentes.css">
<link rel="stylesheet" href="../css/pascalia-tokens.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: var(--f-body); color: var(--graphite);
    background: radial-gradient(60% 70% at 85% 30%, rgba(255,193,7,.22), transparent 70%), linear-gradient(160deg, var(--cream), #fff 70%); }
  .flor { position: absolute; width: 620px; right: -120px; top: -40px; opacity: .22; }
  .in { position: absolute; left: 80px; top: 80px; right: 380px; }
  .logo { height: 64px; }
  h1 { margin: 52px 0 0; font: 800 70px/1.04 var(--f-head); letter-spacing: -.02em; }
  .mark { background: linear-gradient(transparent 58%, var(--yellow) 58%, var(--yellow) 90%, transparent 90%); padding: 0 .06em; }
  p { margin: 24px 0 0; font-size: 28px; color: var(--muted); }
  .url { position: absolute; left: 80px; bottom: 48px; font: 700 24px var(--f-head); background: var(--yellow); padding: 12px 26px; border-radius: 999px; }
</style>
</head>
<body>
  <img class="flor" src="../logos/flor.svg" alt="">
  <div class="in">
    <img class="logo" src="../logos/logo-horizontal.svg" alt="PascalIA">
    <h1>Ideas que hacen <span class="mark">florecer</span> tu organización</h1>
    <p>Consultoría · Desarrollo · Capacitación</p>
  </div>
  <span class="url">pascalia.lat</span>
</body>
</html>
